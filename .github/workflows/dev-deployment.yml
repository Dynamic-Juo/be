name: Development deployment request

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, or create an environment-bound request artifact
        required: true
        type: choice
        default: validate
        options:
          - validate
          - approve
      ci_run_id:
        description: Successful backend CI run ID from a main push
        required: true
        type: string
      ci_run_attempt:
        description: Attempt number of the backend CI run
        required: true
        type: string
        default: "1"
      source_sha:
        description: Full 40-character source commit SHA tested by that run
        required: true
        type: string

permissions: {}

concurrency:
  group: conan-development-deployment
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified-release-artifact: ${{ steps.verified-release-artifact.outputs.name }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require an exact main dispatch
        env:
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          if [ "$REQUEST_REF" != "refs/heads/main" ]; then
            echo "::error::Development requests must be dispatched from main."
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$REQUEST_SHA" ]; then
            echo "::error::Only the release built from the exact dispatch-time main SHA is deployable."
            exit 1
          fi
          if [ "$REQUEST_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Dispatch a fresh request; environment review history is not attempt-scoped."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate request identifiers
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          python scripts/release_manifest.py validate-identifiers \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-attempt "$CI_RUN_ATTEMPT"
      - name: Verify the successful main push run
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "$RUNNER_TEMP/ci-run.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          python scripts/release_manifest.py verify-run \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-attempt "$CI_RUN_ATTEMPT" \
            --run-record "$RUNNER_TEMP/ci-run.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: conan-release-${{ inputs.source_sha }}-${{ inputs.ci_run_attempt }}
          path: verified-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Verify immutable release metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          python scripts/release_manifest.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-attempt "$CI_RUN_ATTEMPT" \
            --manifest verified-release/conan-release.json
      - name: Require the exact release attestation set
        run: |
          set -eu
          for file in \
            verified-release/conan-release.json \
            verified-release/conan-release.sigstore.json \
            verified-release/conan-image.sigstore.json; do
            if [ ! -f "$file" ] || [ -L "$file" ] || [ ! -s "$file" ]; then
              echo "::error::Missing or unsafe verified release file: $file"
              exit 1
            fi
          done
      - name: Record verified release artifact identity
        id: verified-release-artifact
        run: echo "name=verified-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verified-release-artifact.outputs.name }}
          path: |
            verified-release/conan-release.json
            verified-release/conan-release.sigstore.json
            verified-release/conan-image.sigstore.json
          retention-days: 1
          if-no-files-found: error
      - name: Fail closed until approval automation is enabled
        if: ${{ inputs.action == 'approve' }}
        env:
          DEPLOY_ENABLED: ${{ vars.CONAN_DEV_DEPLOY_ENABLED }}
        run: |
          set -eu
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::error::Set CONAN_DEV_DEPLOY_ENABLED only after the protected environment is configured."
            exit 1
          fi
      - name: Record validation scope
        run: |
          echo "The release metadata was validated. No server was contacted and nothing was deployed." >> "$GITHUB_STEP_SUMMARY"

  approve-development:
    if: ${{ inputs.action == 'approve' }}
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: conan-development
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Require the environment protection audit marker
        env:
          ENVIRONMENT_CONFIGURED: ${{ vars.CONAN_DEV_ENVIRONMENT_CONFIGURED }}
        run: |
          set -eu
          if [ "$ENVIRONMENT_CONFIGURED" != "true" ]; then
            echo "::error::Set the marker only after required reviewers and the main-only branch rule are audited."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify-release.outputs.verified-release-artifact }}
          path: gated-request
      - name: Create the environment-bound request envelope
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os
          from pathlib import Path
          import re
          import uuid

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          release_path = Path("gated-request/conan-release.json")
          raw_release = release_path.read_bytes()
          if not raw_release or len(raw_release) > 64 * 1024:
              raise SystemExit("invalid release manifest size")
          try:
              release = json.loads(
                  raw_release.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
          except (UnicodeError, ValueError) as exc:
              raise SystemExit("invalid release manifest JSON") from exc
          canonical_release = (
              json.dumps(release, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          if type(release) is not dict or raw_release != canonical_release:
              raise SystemExit("release manifest is not canonical")

          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["GITHUB_SHA"]
          dispatch_actor = os.environ["DISPATCH_ACTOR"]
          if os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch" or os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("deployment request is only valid for workflow_dispatch/main")
          if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is None:
              raise SystemExit("invalid repository")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None or release.get("source_sha") != source_sha:
              raise SystemExit("release source SHA does not match request SHA")
          if re.fullmatch(r"[A-Za-z0-9-]{1,64}(?:\[bot\])?", dispatch_actor) is None:
              raise SystemExit("invalid dispatch actor")

          def positive(name):
              raw = os.environ[name]
              if re.fullmatch(r"[1-9][0-9]*", raw) is None:
                  raise SystemExit(f"invalid {name}")
              return int(raw)

          request_attempt = positive("GITHUB_RUN_ATTEMPT")
          if request_attempt != 1:
              raise SystemExit("deployment request must use the first run attempt")
          repository_id = positive("GITHUB_REPOSITORY_ID")
          repository_owner_id = positive("GITHUB_REPOSITORY_OWNER_ID")
          expected_ci_run_id = positive("EXPECTED_CI_RUN_ID")
          expected_ci_run_attempt = positive("EXPECTED_CI_RUN_ATTEMPT")
          expected_release_keys = {
              "ci_run_attempt", "ci_run_id", "created_at", "event", "image",
              "image_digest", "image_repository", "repository", "repository_id",
              "repository_owner_id", "schema_version", "source_sha", "workflow_path",
          }
          if set(release) != expected_release_keys:
              raise SystemExit("release manifest fields do not match the pinned contract")
          expected_release = {
              "ci_run_attempt": expected_ci_run_attempt,
              "ci_run_id": expected_ci_run_id,
              "event": "push",
              "repository": repository,
              "repository_id": repository_id,
              "repository_owner_id": repository_owner_id,
              "schema_version": 2,
              "source_sha": source_sha,
              "workflow_path": ".github/workflows/backend-ci.yml",
          }
          if any(type(release.get(key)) is not type(value) or release.get(key) != value
                 for key, value in expected_release.items()):
              raise SystemExit("release identity does not match the approved CI input")
          image_repository = f"ghcr.io/{repository.lower()}"
          image_digest = release.get("image_digest")
          if (
              release.get("image_repository") != image_repository
              or type(image_digest) is not str
              or re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest) is None
              or release.get("image") != f"{image_repository}@{image_digest}"
          ):
              raise SystemExit("release image identity is invalid")
          created_at = release.get("created_at")
          try:
              parsed_created_at = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
          except (AttributeError, ValueError) as exc:
              raise SystemExit("release created_at is invalid") from exc
          if parsed_created_at.tzinfo is None or parsed_created_at.utcoffset() is None:
              raise SystemExit("release created_at must include a timezone")
          issued_at = datetime.now(timezone.utc)
          request = {
              "dispatch_actor": dispatch_actor,
              "dispatch_actor_id": positive("DISPATCH_ACTOR_ID"),
              "environment": "conan-development",
              "expires_at": (issued_at + timedelta(hours=1)).isoformat(),
              "issued_at": issued_at.isoformat(),
              "operation": "deploy",
              "release": release,
              "repository": repository,
              "repository_id": repository_id,
              "repository_owner_id": repository_owner_id,
              "request_id": str(uuid.uuid4()),
              "request_ref": "refs/heads/main",
              "request_run_attempt": request_attempt,
              "request_run_id": positive("GITHUB_RUN_ID"),
              "request_sha": source_sha,
              "schema_version": 3,
              "target_id": "conan-development",
              "workflow_path": ".github/workflows/dev-deployment.yml",
          }
          Path("gated-request/conan-development-request.json").write_text(
              json.dumps(request, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Attest the environment-gated request
        id: attest-request
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: gated-request/conan-development-request.json
      - name: Include the verification bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-request.outputs.bundle-path }}
        run: |
          set -eu
          cp -- "$ATTESTATION_BUNDLE" gated-request/conan-development-request.sigstore.json
      - name: Require the exact five-file deployment artifact
        run: |
          set -eu
          for file in \
            gated-request/conan-development-request.json \
            gated-request/conan-development-request.sigstore.json \
            gated-request/conan-release.json \
            gated-request/conan-release.sigstore.json \
            gated-request/conan-image.sigstore.json; do
            if [ ! -f "$file" ] || [ -L "$file" ] || [ ! -s "$file" ]; then
              echo "::error::Missing or unsafe deployment artifact file: $file"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: environment-bound-conan-development-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gated-request/conan-development-request.json
            gated-request/conan-development-request.sigstore.json
            gated-request/conan-release.json
            gated-request/conan-release.sigstore.json
            gated-request/conan-image.sigstore.json
          retention-days: 30
          if-no-files-found: error
      - name: Record approval boundary
        run: |
          echo "A one-hour deployment request and its Sigstore attestation were created after the conan-development gate. The workflow has no server access and did not deploy it." >> "$GITHUB_STEP_SUMMARY"
