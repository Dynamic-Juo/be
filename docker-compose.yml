services:
  deepcheck-api:
    build: .
    # playground 레포도 같은 구성으로 컨테이너를 띄우므로 이미지 이름을 분리한다.
    # 같은 이름을 쓰면 한쪽에서 빌드한 이미지로 다른 쪽 컨테이너가 뜬다.
    image: conan-be:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 아래 environment에 나열한 값만 컨테이너로 전달된다. 그 외의 DEEPCHECK_* 설정
    # (deepcheck/config.py 참고)을 바꾸려면 .env 파일에 적는다. 파일이 없어도 뜬다.
    env_file:
      - path: .env
        required: false
    environment:
      # 동시 분석 영상 수. M-07이 1건으로 정했다(STT·딥페이크가 CPU를 크게 쓴다).
      DEEPCHECK_WORKERS: "${DEEPCHECK_WORKERS:-1}"
      # 한 영상 안에서 동시에 검증할 주장 수(M-07: 최대 3건 병렬).
      DEEPCHECK_CLAIM_WORKERS: "${DEEPCHECK_CLAIM_WORKERS:-3}"
      DEEPCHECK_LOG_LEVEL: "${DEEPCHECK_LOG_LEVEL:-INFO}"
      # 운영에서는 json으로 두면 로그 수집·검색이 쉽다.
      DEEPCHECK_LOG_FORMAT: "${DEEPCHECK_LOG_FORMAT:-text}"
      # 브라우저에서 호출할 오리진. 자격증명이 필요해지면 "*" 대신 명시해야 한다.
      DEEPCHECK_CORS_ORIGINS: "${DEEPCHECK_CORS_ORIGINS:-*}"
      # 지정할 때만 VLM 단계를 실행한다. 제공자는 DEEPCHECK_VLM_PROVIDER로 교체 가능.
      DEEPCHECK_VLM_MODEL: "${DEEPCHECK_VLM_MODEL:-}"
      # 확정 T-02 기본은 STT(off). manual/any는 명시적으로 선택한다.
      DEEPCHECK_CAPTION_POLICY: "${DEEPCHECK_CAPTION_POLICY:-off}"
      # 전문 기관의 공개 판정을 검색한다. rating만으로 확정 판정하지 않는다.
      DEEPCHECK_GOOGLE_FACTCHECK_API_KEY: "${DEEPCHECK_GOOGLE_FACTCHECK_API_KEY:-}"
      # 0이면 무제한. M-04가 "검증 가능한 주장을 모두 검증"으로 정해서,
      # 개수가 아니라 처리 시간으로 자른다.
      DEEPCHECK_MAX_CLAIMS: "${DEEPCHECK_MAX_CLAIMS:-0}"
      # 지원 영상 최대 길이(초). M-02가 Shorts 기준 3분으로 정했다. 0이면 검사 안 함.
      DEEPCHECK_MAX_VIDEO_SEC: "${DEEPCHECK_MAX_VIDEO_SEC:-180}"
      # --- LLM (주장 추출·판정) ---
      # off면 전부 규칙 기반. deepseek / openai_compatible / ollama 중에서 고른다.
      # 키는 .env에 DEEPCHECK_LLM_API_KEY로 넣는다(여기 적지 않는다).
      DEEPCHECK_LLM_PROVIDER: "${DEEPCHECK_LLM_PROVIDER:-off}"
      DEEPCHECK_LLM_MODEL: "${DEEPCHECK_LLM_MODEL:-deepseek-chat}"
      # rule=정규식, llm=LLM. llm 설정의 제공자/호출 실패는 분석 불가로 표시한다.
      DEEPCHECK_CLAIM_EXTRACTOR: "${DEEPCHECK_CLAIM_EXTRACTOR:-rule}"
      # 근거 검색 수단. 네이버 자격 정보가 없으면 그 항목만 자동으로 빠진다.
      DEEPCHECK_EVIDENCE_PROVIDERS: "${DEEPCHECK_EVIDENCE_PROVIDERS:-factcheck,naver_news,naver_encyc,wikipedia,wikipedia_en}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # 모델 가중치(faster-whisper + HF 분류기)를 재시작해도 다시 받지 않게 보존한다.
      - model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      # 기본 설정이면 컨테이너 로그가 무한히 커진다. 장기 운영 전제라 상한을 둔다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 호스트 여력을 확인한 뒤 조정한다.
    # mem_limit: 3g
    # cpus: 2

volumes:
  model-cache:
