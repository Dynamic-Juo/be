services:
  deepcheck-api:
    build: .
    # playground 레포도 같은 구성으로 컨테이너를 띄우므로 이미지 이름을 분리한다.
    # 같은 이름을 쓰면 한쪽에서 빌드한 이미지로 다른 쪽 컨테이너가 뜬다.
    image: conan-be:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 동시 분석 수. 각각 CPU를 많이 쓰므로 코어가 적은 호스트는 1-2로 둔다.
      DEEPCHECK_WORKERS: "${DEEPCHECK_WORKERS:-2}"
      DEEPCHECK_LOG_LEVEL: "${DEEPCHECK_LOG_LEVEL:-INFO}"
      # 운영에서는 json으로 두면 로그 수집·검색이 쉽다.
      DEEPCHECK_LOG_FORMAT: "${DEEPCHECK_LOG_FORMAT:-text}"
      # 브라우저에서 호출할 오리진. 자격증명이 필요해지면 "*" 대신 명시해야 한다.
      DEEPCHECK_CORS_ORIGINS: "${DEEPCHECK_CORS_ORIGINS:-*}"
      # 지정할 때만 VLM 단계를 실행한다. 제공자는 DEEPCHECK_VLM_PROVIDER로 교체 가능.
      DEEPCHECK_VLM_MODEL: "${DEEPCHECK_VLM_MODEL:-}"
      # 자막이 있으면 STT를 건너뛴다. any로 두면 자동 생성 자막까지 사용한다.
      DEEPCHECK_CAPTION_POLICY: "${DEEPCHECK_CAPTION_POLICY:-manual}"
      # 있으면 전문 기관의 공개 판정을 검색해 지지/반박 판정을 낼 수 있다.
      DEEPCHECK_GOOGLE_FACTCHECK_API_KEY: "${DEEPCHECK_GOOGLE_FACTCHECK_API_KEY:-}"
      DEEPCHECK_MAX_CLAIMS: "${DEEPCHECK_MAX_CLAIMS:-5}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # 모델 가중치(faster-whisper + HF 분류기)를 재시작해도 다시 받지 않게 보존한다.
      - model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      # 기본 설정이면 컨테이너 로그가 무한히 커진다. 장기 운영 전제라 상한을 둔다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 호스트 여력을 확인한 뒤 조정한다.
    # mem_limit: 3g
    # cpus: 2

volumes:
  model-cache:
