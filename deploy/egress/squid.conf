# API 전용 내부망에서만 연결한다. 호스트에 포트를 게시하지 않는다.
http_port 0.0.0.0:3128
acl CONNECT method CONNECT
acl TLS_ports port 443
acl permitted dstdomain .youtube.com .youtu.be .googlevideo.com .ytimg.com .ggpht.com api.deepseek.com openapi.naver.com .wikipedia.org .wikimedia.org .huggingface.co .hf.co storage.googleapis.com challenges.cloudflare.com
acl forbidden dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32
http_access deny !CONNECT
http_access deny !TLS_ports
http_access deny !permitted
http_access deny forbidden
http_access allow permitted
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
visible_hostname chamsae-egress
pinger_enable off
cache_mem 16 MB
