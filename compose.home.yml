# 맥미니용 독립 실행 파일. 기본 compose와 -f로 합치지 않는다.
# docker compose --env-file .env.home -f compose.home.yml ...
# !reset 지원을 위해 Docker Compose 2.24.4 이상을 사용한다.
name: conan-home

services:
  deepcheck-api:
    extends:
      file: docker-compose.yml
      service: deepcheck-api
    platform: linux/arm64
    image: ${CONAN_IMAGE:-conan-be:home}
    ports: !reset []
    env_file: !override
      - path: ${CONAN_ENV_FILE:-.env.home}
        required: true
    environment:
      DEEPCHECK_CORS_ORIGINS: ${DEEPCHECK_CORS_ORIGINS:?허용할 프론트 오리진을 지정하세요}
      DEEPCHECK_LOG_FORMAT: json
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    cpus: ${CONAN_CPUS:-2}
    mem_limit: ${CONAN_MEMORY:-3g}
    init: true
    networks:
      ingress:
        aliases:
          - ${CONAN_NETWORK_ALIAS:-conan-api}

networks:
  ingress:
    external: true
    name: ${CONAN_NETWORK:-conan-ingress}

volumes:
  model-cache:
